# Quantavius the 1st - no-orders check (added 2026-11-21). The forward test is a simulation: no script or workflow may
# contain an order-related call. Runs on every push that touches scripts, strategies or workflows; a hit fails the run
# and opens an issue. Read-only: this workflow changes nothing in the repo.
name: no-orders
on:
  push:
    paths: ["scripts/**", "strategies/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan for order-related calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 scripts/no_orders.py . > /tmp/scan.txt; then
            cat /tmp/scan.txt
            gh issue create --title "ORDER CALL FOUND $(date -u +%F)" --body "$(head -c 3000 /tmp/scan.txt)  Commit $GITHUB_SHA." || true
            exit 1
          fi
          cat /tmp/scan.txt
