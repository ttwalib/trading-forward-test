# Quantavius the 1st - witness on push (picks 2026-11-23; seals, sampler drafts and rankings 2026-11-24, review N1).
# When a task pushes picks, a seal or a ranking, GitHub records when it first saw each object (scripts/witness.py, one
# file per sighting in data/witness/obj/), using GitHub's own push time. The 5-minute tick and the nightly maths do the
# same as a backstop. Reads the repository only; no orders, no keys.
name: picks-witness
on:
  push:
    paths: ["data/ledger/AgentPicks.jsonl", "data/allocator/judge.jsonl", "data/allocator/judge_daily.jsonl",
            "data/allocator/contest_*.jsonl", "data/allocator/drafts/**", "data/picks/rank/**"]
permissions:
  contents: write
concurrency:
  group: picks-witness
  cancel-in-progress: false
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Witness
        env:
          WITNESS_AT: ${{ github.event.repository.pushed_at }}
        run: python3 scripts/witness.py .
      - name: Commit
        run: |
          git config user.name "quantavius-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/witness
          git diff --cached --quiet && exit 0
          git commit -q -m "data: witness $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then OK=1; break; fi
            sleep $((i * 5))
          done
          [ "$OK" = "1" ] || exit 1
