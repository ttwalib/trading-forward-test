# Quantavius the 1st - free market data (Alpaca free plan + Cboe). Runs on GitHub's servers, so price data never
# passes through the AI as text. Keys live only in the repo secrets ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY.
# Read-only market data: this workflow never touches orders or accounts.
# Schedules run as the account that last edited this file, so edits go through the owner's account (2026-11-19).
name: market-data
on:
  schedule:
    # The 5-minute ticks come from an external pinger (cron-job.org, set up 2026-11-20; ops/engine_pinger.md) calling
    # workflow_dispatch with mode "tick": GitHub ran its own */5 schedule only about hourly. Backup tick at :50 each hour.
    - cron: "50 14-20 * * 1-5"
    - cron: "40 22 * * 1-5"        # nightly daily bars, corporate actions, VIX (after the 17:00 ET cut)
    - cron: "32 0-23/3 * * *"      # crypto bars every 3 hours, before each crypto-tracks run (added 2026-11-20)
    - cron: "7 3 * * *"            # nightly machine-learning job (22:07 ET; scripts/daily.py ml; an AI task until 2026-11-22)
    - cron: "17 10 * * *"          # second daily fit of the crypto ML family (05:17 ET; the nightly ML task is the first)
    - cron: "0 2 * * 2-6"          # nightly maths on a schedule (21:00 New York in winter, 22:00 from 2027-03-14), so scoring never depends on an AI task (2026-11-23)
  workflow_dispatch:
    inputs:
      mode:
        description: "tick | intraday | nightly | backfill | universe | hist | crypto | etfs | wide5m | borrow | compute | mlcrypto | mlnight | vendor | pit | optbars"
        default: backfill
      day:
        description: "compute only: the trading day YYYY-MM-DD (empty = today in New York)"
        default: ""
  push:
    paths: ["ops/fetch_request.json"]   # edit this file to request a run (mode inside) without the GitHub UI
permissions:
  contents: write
  issues: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick mode
        id: m
        run: |
          D=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ github.event.inputs.mode }}"; D="${{ github.event.inputs.day }}";
          elif [ "${{ github.event_name }}" = "push" ]; then M=$(python3 -c "import json;print(json.load(open('ops/fetch_request.json'))['mode'])"); D=$(python3 -c "import json;print(json.load(open('ops/fetch_request.json')).get('day',''))");
          elif [ "${{ github.event.schedule }}" = "40 22 * * 1-5" ]; then M=nightly;
          elif [ "${{ github.event.schedule }}" = "32 0-23/3 * * *" ]; then M=crypto;
          elif [ "${{ github.event.schedule }}" = "7 3 * * *" ]; then M=mlnight;
          elif [ "${{ github.event.schedule }}" = "17 10 * * *" ]; then M=mlcrypto;
          elif [ "${{ github.event.schedule }}" = "0 2 * * 2-6" ]; then M=compute; D=$(TZ=America/New_York date +%F); else M=tick; fi
          case "$M" in tick|intraday|nightly|backfill|universe|hist|crypto|etfs|wide5m|borrow|compute|mlcrypto|mlnight|vendor|pit|optbars) ;; *) echo "unknown mode"; exit 1;; esac
          case "$D" in ""|[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "bad day"; exit 1;; esac
          echo "mode=$M" >> "$GITHUB_OUTPUT"; echo "day=$D" >> "$GITHUB_OUTPUT"
      # Nightly maths with no AI in the loop (scripts/nightly.py): library, cost stress, ideal fills, allocator, stats.
      - name: Compute
        if: steps.m.outputs.mode == 'compute'
        run: |
          pip install -q numpy
          python3 scripts/nightly.py . "${{ steps.m.outputs.day }}" || echo "nightly maths failed (see data/nightly/stamp.json)"
      # Second daily crypto ML fit, no AI in the loop: rebuild the decision rows from the ledger, evaluate, refit.
      - name: Crypto ML
        if: steps.m.outputs.mode == 'mlcrypto'
        run: |
          pip install -q numpy==2.5.3 scikit-learn==1.9.1 || pip install -q numpy scikit-learn
          python3 scripts/decisions.py build . > /dev/null || echo "decisions build failed"
          python3 -c "import pickle;b=pickle.load(open('models/stock.pkl','rb'));print('stock model loads on this runner:',b['kind'],b['trained_on'])" || echo "stock model does not load here"
          python3 scripts/ml.py train-crypto . "$(TZ=America/New_York date +%F)" | tail -n 25 || echo "crypto ML fit failed"
      - name: ML nightly
        if: steps.m.outputs.mode == 'mlnight'
        run: |
          pip install -q numpy==2.5.3 scikit-learn==1.9.1 || pip install -q numpy scikit-learn
          python3 scripts/daily.py ml . "${{ steps.m.outputs.day }}" | tail -n 30 || echo "ML nightly failed (see data/nightly/ml_report.json)"
      # One-off: a pinned copy of TradingView Lightweight Charts (Apache 2.0) for the dashboard, so the page needs no CDN.
      - name: Vendor
        if: steps.m.outputs.mode == 'vendor'
        run: |
          mkdir -p ops/dashboard/vendor /tmp/lwc && cd /tmp/lwc && npm pack -q lightweight-charts@5.0.9 && tar xzf lightweight-charts-5.0.9.tgz
          cp package/dist/lightweight-charts.standalone.production.js "$GITHUB_WORKSPACE/ops/dashboard/vendor/lightweight-charts-5.0.9.js"
          for f in LICENSE NOTICE; do if [ -e package/$f ]; then cp package/$f "$GITHUB_WORKSPACE/ops/dashboard/vendor/lightweight-charts-$f"; fi; done
          ls -la "$GITHUB_WORKSPACE/ops/dashboard/vendor"
      - name: Fetch
        if: steps.m.outputs.mode != 'compute' && steps.m.outputs.mode != 'mlcrypto' && steps.m.outputs.mode != 'mlnight' && steps.m.outputs.mode != 'vendor'
        env:
          QV_ENGINE_NEW: /tmp/engine_new.json
          GH_TOKEN: ${{ github.token }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python3 scripts/fetch_free.py "${{ steps.m.outputs.mode }}" .
          if [ "${{ steps.m.outputs.mode }}" = "tick" ]; then python3 scripts/engine.py . || echo "engine failed"; fi
          if [ "${{ steps.m.outputs.mode }}" = "tick" ]; then python3 scripts/witness.py . || echo "witness failed"; fi
          python3 scripts/dashboard.py . || echo "dashboard data failed"
      # Scripted daily work with no AI in the loop (scripts/daily.py). Crypto tracks: right after the crypto bars.
      - name: Daily
        if: steps.m.outputs.mode == 'crypto'
        run: |
          pip install -q numpy==2.5.3 scikit-learn==1.9.1 || pip install -q numpy scikit-learn || true
          python3 scripts/daily.py crypto . | tail -n 40 || echo "daily crypto failed (see ops/diag/daily_crypto.json)"
      # ML at detection: only on ticks where the engine sealed a new baseline breakout (a few a day), so the usual
      # tick stays short. Same package versions as the ones the model file was saved with.
      - name: Score
        if: steps.m.outputs.mode == 'tick' && hashFiles('models/stock.pkl') != ''
        run: |
          if [ -s /tmp/engine_new.json ]; then
            (pip install -q numpy==2.5.3 scikit-learn==1.9.1 && python3 scripts/ml.py predict-engine . /tmp/engine_new.json "$(TZ=America/New_York date '+%F %H:%M')" | tail -n 5) || echo "engine ML scoring failed"
          fi
      # The hourly backup tick doubles as a watchdog: no pinger tick for 20 minutes in market hours -> one open issue.
      - name: Watchdog
        if: github.event_name == 'schedule' && steps.m.outputs.mode == 'tick'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=$(python3 -c "import sys;sys.path.insert(0,'scripts');import checks;print(' | '.join(a for a in checks.health('.')['alerts'] ))" || true)
          if [ -n "$A" ]; then
            N=$(gh issue list --state open --search "Health alert in:title" --json number --jq 'length' || echo 1)
            if [ "$N" = "0" ]; then gh issue create --title "Health alert $(date -u +%F)" --body "$A  (from scripts/checks.py health; see ops/engine_pinger.md and the runbook HEALTH section)" || true; fi
          fi
      - name: Commit
        run: |
          git config user.name "quantavius-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/bars data/opt_legs.json ops/diag/optbars.json data/corp data/borrow data/pit data/decisions/engine_ml ops/diag/fetch_free.json ops/diag/ticks.json data/hist data/decisions/engine ops/diag/engine.json data/dashboard.json data/state ops/diag/daily_crypto.json data/witness; do if [ -e "$p" ]; then git add "$p"; fi; done
          if [ "${{ steps.m.outputs.mode }}" = "vendor" ]; then git add ops/dashboard/vendor; fi
          if [ "${{ steps.m.outputs.mode }}" = "crypto" ]; then git add data/ledger/CryptoTracks.jsonl data/ledger/MLShadow.jsonl; fi
          if [ "${{ steps.m.outputs.mode }}" = "mlcrypto" ]; then
            for p in data/decisions/crypto.jsonl models/crypto.pkl models/crypto_report_*.json; do if [ -e "$p" ]; then git add "$p"; fi; done
          fi
          if [ "${{ steps.m.outputs.mode }}" = "mlnight" ]; then
            for p in data/decisions/stock.jsonl data/decisions/crypto.jsonl data/decisions/hist models data/ledger/MLShadow.jsonl data/nightly/ml_report.json; do if [ -e "$p" ]; then git add "$p"; fi; done
          fi
          if [ "${{ steps.m.outputs.mode }}" = "compute" ]; then
            for p in data/nightly data/library data/allocator data/ledger/Library.jsonl reports/stats ops/freeze.json ops/SPEC.md strategies/registry.json data/lane ops/chain.jsonl data/picks data/ai data/witness; do if [ -e "$p" ]; then git add "$p"; fi; done
          fi
          git diff --cached --quiet && exit 0
          git commit -q -m "data: ${{ steps.m.outputs.mode }} $(date -u +%FT%TZ)"
          git checkout -q -- . || true     # drop rebuilt files that are not part of this run's commit
          for i in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then OK=1; break; fi
            sleep $((i * 7))
          done
          [ "$OK" = "1" ] || exit 1
          # Proof of pre-registration: the first commit that holds ops/freeze.json gets a permanent tag (GitHub stores
          # the push time), so anyone can check that the frozen code and the verdict rules predate the results.
          # The same for the pre-registration record (ops/preregistration.md, 2026-11-21). The tag goes on this run's own
          # data commit: GitHub refuses a workflow token that tags a commit which itself changed a workflow file.
          if [ -e ops/preregistration.md ] && ! git ls-remote --exit-code --tags origin prereg-2026-11-21 >/dev/null 2>&1; then
            git tag -a prereg-2026-11-21 -m "Pre-registration record: hypotheses, amendments, response rule (ops/preregistration.md)" && git push -q origin prereg-2026-11-21 || true
          fi
          if [ -e ops/freeze.json ] && ! git ls-remote --exit-code --tags origin freeze-registered >/dev/null 2>&1; then
            git tag -a freeze-registered -m "Change freeze recorded: hashes in ops/freeze.json, rules in ops/runbook.md" && git push -q origin freeze-registered || true
          fi
