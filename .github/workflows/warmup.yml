# Quantavius the 1st - warm-up daily bars 2014-07 to 2015-12 (scripts/warmup.py; build_todo item 13, owner decisions
# 2026-11-26). Look-back only: the tuning window stays 2016-2021 and 2022 onwards stays held out. Tiingo does the bulk,
# Alpha Vantage covers what Tiingo lacks and cross-checks 30 symbols; Cboe gives VIX and VIX3M. Each run is one
# rate-limited step (Tiingo 50 an hour, 500 symbols a month; Alpha Vantage about 25 calls a day), so the job resumes every
# hour and switches itself off once data/pit/warmup/state.json says complete. Read-only market data: no orders, no accounts.
# Committed under the owner's identity (2026-11-26) so the hourly schedule runs: GitHub runs schedules as the account
# that last edited the workflow file.
name: warmup
on:
  schedule:
    - cron: "23 * * * *"
  push:
    paths: ["ops/warmup_request.json"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: warmup
  cancel-in-progress: false
jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: One step
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python3 scripts/warmup.py run . | tail -n 40
      - name: Commit
        run: |
          git config user.name forward-test-bot
          git config user.email forward-test-bot@users.noreply.github.com
          git add data/pit/warmup data/pit/monthly_top100.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "data: warmup $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then break; fi
            sleep $((i * 7))
          done
      - name: Switch off when complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('data/pit/warmup/state.json')).get('complete') else 1)" 2>/dev/null; then
            gh workflow disable warmup.yml -R "$GITHUB_REPOSITORY" && echo "warm-up complete: workflow disabled"
          fi
